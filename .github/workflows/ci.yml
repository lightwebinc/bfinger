name: CI

on:
  push:
    # main only: a branch that has a PR is already covered by the
    # pull_request run, and a bare-branch push ran the whole matrix a
    # second time per PR (github.ref differs between the two events, so
    # the concurrency group cannot dedupe them).
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Pinned to the BUILDER toolchain, not the go.mod floor. The floor is
          # held at 1.26.2 on purpose; the shipped stdlib comes from
          # the Dockerfile builder (golang:1.27-alpine). go-version-file: go.mod
          # reads the floor, so it exercised a stdlib we never ship -- which
          # surfaced in vuln.yml as 10 stdlib advisories fixed in 1.26.x.
          go-version: "1.27.1"
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...
      # The dependency rule, asserted rather than intended. A third direct
      # dependency arriving by accident is how a small tool quietly acquires an
      # engine, and it is invisible in a diff that only adds an import. The
      # direct set is exactly go-sdk and bcommon, bcommon's own is exactly
      # go-sdk both as its go.mod declares and as its linked packages import,
      # and go-sdk resolves to v1.5.2 whatever the library asks for.
      - name: direct dependencies are go-sdk and bcommon, go-sdk at v1.5.2
        run: make deps-check
      # LICENSE-THIRD-PARTY is generated from what the binary actually links,
      # so a new dependency that nobody notices is a licence obligation that
      # nobody notices. This fails the build instead.
      - name: third-party licences are current
        run: python3 scripts/gen-third-party-licenses.py . --check

  # The overlay host modules are a separate npm package with its own
  # toolchain. They are tested here rather than by the operator who loads
  # them, and against the same golden vector the Go packages parse, so a
  # change that moves one side and not the other fails in CI.
  host:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # The runtime major the reference overlay host runs, which
          # package.json also pins. Testing on anything else tests a host
          # nobody deploys.
          node-version: "24"
          cache: npm
          cache-dependency-path: host/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run check
      # pretest builds dist/ and the shipped bundle, whose build fails when
      # anything but host/src/ and the bcommon package went into it; the
      # tests then run on dist/, and the smoke test mounts the bundle itself.
      - name: build, bundle and test
        run: npm test
