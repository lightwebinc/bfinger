name: image-publish

# Manual, gated image publish. No automated trigger.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RELEASE to publish image to ghcr.io'
        required: true
      tag:
        description: 'Image tag, a released version without the v (e.g. 0.3.5)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event.inputs.confirm == 'RELEASE'
    runs-on: ubuntu-latest
    steps:
      # Build from the git tag being published: input '0.1.0' -> tag 'v0.1.0'.
      # Checkout fails the run if that tag does not exist: push the git tag first.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/v${{ github.event.inputs.tag }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/lightwebinc/bfinger:${{ github.event.inputs.tag }}
            ghcr.io/lightwebinc/bfinger:latest
          build-args: |
            VERSION=${{ github.event.inputs.tag }}

      # The host image: the reference overlay host with the finger modules
      # built in. BLUEPRINTS pins the host image it is built on.
      - name: Build and push finger-host
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: host/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ghcr.io/lightwebinc/finger-host:${{ github.event.inputs.tag }}
            ghcr.io/lightwebinc/finger-host:latest
          build-args: |
            BLUEPRINTS=ghcr.io/lightwebinc/overlay-blueprints:0.2.2
